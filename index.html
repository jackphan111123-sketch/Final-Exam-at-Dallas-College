<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>T-Minus Finals Lock Screen Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .device-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 440px;
      max-height: 956px;
      background: url('lockscreen.jpeg') center center / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }
    .clock-overlay {
      position: absolute;
      top: 9%;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .date {
      font-size: 19px;
      font-weight: 500;
      letter-spacing: -0.2px;
      margin-bottom: 2px;
      opacity: 0.95;
    }
    .time {
      font-size: 82px;
      font-weight: 200;
      line-height: 1;
      letter-spacing: -2px;
    }
    .actions {
      position: absolute;
      bottom: 18px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .btn {
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.2px;
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>
  <div class="device-container">
    <div class="clock-overlay">
      <div class="date" id="live-date">Tuesday, Nov 10</div>
      <div class="time" id="live-time">09:41</div>
    </div>
    <div class="actions">
      <a href="lockscreen.jpeg" download="Final-Exam-Countdown.jpeg" class="btn">⬇ Download Lock Screen</a>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('live-time').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById('live-date').textContent = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
